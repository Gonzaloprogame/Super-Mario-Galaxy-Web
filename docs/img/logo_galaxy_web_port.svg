<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Galaxy Web Port">
  <title>Galaxy Web Port</title>
  <defs>
    <!-- Night sky -->
    <radialGradient id="sky" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#2a2160"/>
      <stop offset=".45" stop-color="#121733"/>
      <stop offset="1" stop-color="#070912"/>
    </radialGradient>
    <radialGradient id="nebula" cx="78%" cy="30%" r="45%">
      <stop offset="0" stop-color="#b06bff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#b06bff" stop-opacity="0"/>
    </radialGradient>
    <!-- The emblem's star -->
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset=".5" stop-color="#ffd34d"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd34d" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#ff9f43" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ff9f43" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b8cff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#7b8cff"/>
      <stop offset=".75" stop-color="#b06bff"/>
      <stop offset="1" stop-color="#ff9fd6" stop-opacity=".2"/>
    </linearGradient>
    <!-- Lettering -->
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#dfe3ff"/>
      <stop offset="1" stop-color="#a9b4ff"/>
    </linearGradient>
    <linearGradient id="port" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd34d"/>
      <stop offset=".5" stop-color="#ffb36b"/>
      <stop offset="1" stop-color="#ff8fc7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="36" fill="url(#sky)"/>
  <rect width="1200" height="420" rx="36" fill="url(#nebula)"/>
  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="72" cy="58" r="1.6"/><circle cx="160" cy="352" r="1.2"/><circle cx="318" cy="40" r="1.4"/>
    <circle cx="470" cy="372" r="1.1"/><circle cx="612" cy="30" r="1.5"/><circle cx="738" cy="380" r="1.3"/>
    <circle cx="868" cy="52" r="1.2"/><circle cx="1012" cy="362" r="1.6"/><circle cx="1136" cy="74" r="1.3"/>
    <circle cx="1100" cy="250" r="1"/><circle cx="560" cy="250" r=".9"/><circle cx="240" cy="210" r="1"/>
  </g>
  <g fill="#cfd6ff" opacity=".9">
    <path d="M1060 120 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path d="M420 92 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
    <path d="M980 300 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5z"/>
  </g>

  <!-- Emblem: a star inside an orbit, with a small world travelling on it -->
  <g transform="translate(210 210)">
    <circle r="150" fill="url(#halo)"/>
    <ellipse rx="150" ry="52" fill="none" stroke="url(#orbit)" stroke-width="7" transform="rotate(-22)" opacity=".95"/>
    <path fill="url(#star)" filter="url(#glow)"
          d="M0 -104 L27 -36 L101 -32 L44 15 L63 87 L0 47 L-63 87 L-44 15 L-101 -32 L-27 -36 Z"/>
    <path fill="#ffffff" opacity=".35" d="M0 -104 L27 -36 L0 -20 Z"/>
    <!-- the part of the orbit in front of the star -->
    <path d="M-139 57 A150 52 0 0 0 139 -57" fill="none" stroke="url(#orbit)" stroke-width="7"
          transform="rotate(-22)" opacity=".95"/>
    <circle cx="128" cy="-90" r="14" fill="#7b8cff"/>
    <circle cx="124" cy="-94" r="5" fill="#cfd6ff" opacity=".8"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800">
    <text x="410" y="190" font-size="112" letter-spacing="6" fill="url(#title)" filter="url(#glow)">GALAXY</text>
    <text x="414" y="304" font-size="96" letter-spacing="4" fill="url(#title)">WEB</text>
    <text x="680" y="304" font-size="96" letter-spacing="4" fill="url(#port)" filter="url(#glow)">PORT</text>
  </g>
  <!-- The comet under the wordmark -->
  <path d="M414 338 C 620 362, 840 356, 1040 326" fill="none" stroke="url(#orbit)" stroke-width="4"
        stroke-linecap="round" opacity=".9"/>
  <circle cx="1040" cy="326" r="7" fill="#ffffff" filter="url(#soft)"/>
  <circle cx="1040" cy="326" r="4" fill="#ffffff"/>
</svg>
